<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font:14px 'Segoe UI',sans-serif;overflow:hidden;color:#193449}#bubble{position:absolute;inset:18px 16px;background:#f7fbff;border:1px solid #d0dfeb;border-radius:28px;padding:17px 38px 17px 20px;box-shadow:0 5px 15px #17384920}h3{font-size:14px;margin:0 0 7px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}p{margin:0;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}button{position:absolute;top:7px;right:11px;border:0;background:none;font-size:23px;color:#49677b;cursor:pointer}#bubble.pop{animation:pop .55s ease-out forwards}#bubble.glass{animation:glass .55s ease-out forwards}.particle{position:absolute;left:200px;top:90px;width:8px;height:8px;border:1px solid #6c9bbb;border-radius:50%;background:#d9eef744;pointer-events:none;animation:particle .55s ease-out forwards}.particle.glass{border-radius:0;width:15px;height:20px;clip-path:polygon(0 0,100% 30%,30% 100%)}@keyframes pop{35%{opacity:.7;transform:scale(1.04)}100%{opacity:0;transform:scale(1.09)}}@keyframes glass{35%{opacity:.5;clip-path:polygon(0 0,40% 0,50% 45%,70% 0,100% 0,100% 100%,65% 70%,40% 100%,0 100%)}100%{opacity:0;transform:translateY(8px)}}@keyframes particle{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rotation))}}@media(prefers-reduced-motion:reduce){.particle{display:none}#bubble.pop,#bubble.glass{animation:none;opacity:0}}
#bubble{cursor:pointer}#open{position:static;display:block;text-align:left;width:100%;padding:0;font:inherit;color:inherit}#bubble[data-ending] {pointer-events:none}#open:focus-visible{outline:2px solid #6c9bbb;border-radius:8px}</style></head><body><div id="bubble" role="status"><button id="open" aria-label="Abrir mensagem na conversa"><h3 id="notification-title"></h3><p id="notification-body"></p></button><button id="close" aria-label="Fechar notificação">×</button></div><script>
function dismissNotification(effect){const box=document.getElementById('bubble');if(box.dataset.ending)return;box.dataset.ending='1';box.classList.add(effect);for(let i=0;i<12;i++){const part=document.createElement('span');part.className='particle '+effect;const angle=i*Math.PI/6;part.style.setProperty('--dx',Math.cos(angle)*130+'px');part.style.setProperty('--dy',Math.sin(angle)*60+'px');part.style.setProperty('--rotation',i*47+'deg');document.body.append(part);}}
document.getElementById('bubble').onclick=event=>{if(event.target.closest('#close'))return;const box=document.getElementById('bubble');if(box.dataset.ending)return;box.dataset.ending='1';window.notificationApi.open();};
document.getElementById('close').onclick=()=>window.notificationApi.dismiss();
</script></body></html>
